name: khmer_calendar
description: Khmer lunar calendar for phone and desktop.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.2.1
  shared_preferences: ^2.5.3
  http: ^1.5.0
  flutter_svg: ^2.2.1
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  intl: ^0.20.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  flutter_local_notifications: ^19.4.2
  flutter_timezone: ^4.1.1
  timezone: ^0.10.1
  dynamic_color: ^1.8.1
  connectivity_plus: ^6.1.4
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/weather/
    - assets/zodiac/
    - assets/icons/
    - assets/os/
  fonts:
    - family: KantumruyPro
      fonts:
        - asset: assets/fonts/KantumruyPro.ttf
