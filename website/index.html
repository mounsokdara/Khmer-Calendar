<!DOCTYPE html>
<html lang="km">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Khmer lunar calendar, holy days, holidays, weather, and reminders.">
  <meta name="theme-color" content="#9A3B38">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ប្រតិទិនខ្មែរ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>ប្រតិទិនខ្មែរ</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://grok.com/grok-app-builder/extensions.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #9a3b38; color: #fff; font-family: "Kantumruy Pro", system-ui, sans-serif; }
    .boot { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: linear-gradient(165deg,#d9786c 0%,#9a3b38 42%,#5c1a1c 78%,#3a0f14 100%); position: relative; overflow: hidden; }
    .boot h1 { font-size: 1.85rem; margin: 0; font-weight: 700; }
    .boot p { margin: 0; opacity: .78; }
    .boot-bar { width: min(72vw, 260px); height: 4px; border-radius: 99px; background: #ffffff47; overflow: hidden; margin-top: 20px; }
    .boot-bar > span { display: block; height: 100%; width: 32%; background: #fff; border-radius: inherit; animation: bootfill 1.2s linear infinite; }
    @keyframes bootfill { 0% { width: 8%; } 100% { width: 92%; } }
  </style>
</head>
<body>
  <div class="boot" id="boot">
    <h1>ប្រតិទិនខ្មែរ</h1>
    <p>ប្រតិទិនចន្ទគតិខ្មែរ</p>
    <div class="boot-bar" aria-hidden="true"><span></span></div>
  </div>
  <script>
    (function () {
      var CHANNEL = "grok-preview-bridge";
      window.addEventListener("message", function (ev) {
        var d = ev.data;
        if (!d || d.channel !== CHANNEL) return;
        if (d.type === "navigate" && typeof d.path === "string" && d.path.charAt(0) === "/" && d.path.indexOf("//") !== 0) {
          history.pushState({}, "", d.path);
        }
        if (d.type === "history" && (d.delta === -1 || d.delta === 1)) history.go(d.delta);
      });
      window.addEventListener("flutter-first-frame", function () {
        var boot = document.getElementById("boot");
        if (boot) boot.remove();
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
