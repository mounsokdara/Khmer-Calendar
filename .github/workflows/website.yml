name: Website

on:
  push:
    branches: [main]
    paths:
      - "khmer_calendar/lib/**"
      - "khmer_calendar/web/**"
      - "khmer_calendar/assets/**"
      - "khmer_calendar/pubspec.yaml"
      - "khmer_calendar/pubspec.lock"
      - "scripts/flutter-build.mjs"
      - ".github/workflows/website.yml"
  workflow_dispatch:

concurrency:
  group: website
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - name: Build Flutter website
        run: npm run build:web
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "No Cloudflare API token. Committing website/ so a Git-connected Pages project can publish it."
            exit 0
          fi
          npx wrangler pages deploy website --project-name=khmercalendar --branch=main --commit-dirty=true
      - name: Commit website/
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website
          if git diff --cached --quiet; then
            echo "website/ already matches this Dart build"
            exit 0
          fi
          git commit -m "Rebuild website from Flutter"
          git pull --rebase --autostash origin main
          git push
