name: Website

on:
  push:
    branches: [main]
    # Rebuild for every Flutter/app change. Keep website/ out of the trigger
    # because this workflow itself updates website/ after a successful build.
    paths:
      - "khmer_calendar/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".grok/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

concurrency:
  group: website
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record source revision
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Build Flutter website
        run: npm run build:web

      - name: Verify source did not change during build
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN_SHA=$(git rev-parse origin/main)
          if [ "$CURRENT_MAIN_SHA" != "$SOURCE_SHA" ]; then
            echo "main changed during the build ($SOURCE_SHA -> $CURRENT_MAIN_SHA)."
            echo "Stopping so the newer commit gets its own clean web build."
            exit 1
          fi

      - name: Verify Flutter web build
        run: |
          set -euo pipefail
          test -f website/index.html
          test -f website/flutter.js
          test -f website/flutter_service_worker.js
          echo "Flutter web build verified: $SOURCE_SHA"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "No Cloudflare API token. The rebuilt website/ will be committed for Git-connected Pages."
            exit 0
          fi
          npx wrangler pages deploy website --project-name=khmercalendar --branch=main --commit-dirty=true

      - name: Commit rebuilt website
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website
          if git diff --cached --quiet; then
            echo "website/ already matches this Flutter build"
            exit 0
          fi
          git commit -m "Rebuild website from Flutter"
          git push origin HEAD:main
