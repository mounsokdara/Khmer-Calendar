name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true
permissions:
  contents: write


jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/khmer-release.keystore"
      - run: flutter pub get
        working-directory: khmer_calendar
      - run: flutter build apk --release
        working-directory: khmer_calendar
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/khmer-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Sign + verify APK (apksigner v1/v2/v3)
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          OUTDIR=khmer_calendar/build/app/outputs/flutter-apk
          KS_FILE="$RUNNER_TEMP/khmer-release.keystore" bash scripts/sign-apk.sh "$OUTDIR/app-release.apk" "$OUTDIR/app-release-signed.apk"
          mv -f "$OUTDIR/app-release-signed.apk" "$OUTDIR/app-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: khmer_calendar/build/app/outputs/flutter-apk/app-release.apk

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - name: Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get
        working-directory: khmer_calendar
      - run: flutter build linux --release
        working-directory: khmer_calendar
      - name: Pack linux
        run: |
          tar -C khmer_calendar/build/linux/x64/release/bundle -czf KhmerCalendar-linux.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: KhmerCalendar-linux.tar.gz

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: khmer_calendar
      - run: flutter build windows --release
        working-directory: khmer_calendar
        env:
          CXXFLAGS: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      - name: Sign windows (Authenticode)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.DESKTOP_SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.DESKTOP_SIGN_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) { throw "DESKTOP_SIGN_PFX_BASE64 secret is missing" }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $env:PFX_PASS)
          $files = Get-ChildItem khmer_calendar\build\windows\x64\runner\Release -Recurse -Include *.exe,*.dll
          foreach ($f in $files) {
            $r = Set-AuthenticodeSignature -FilePath $f.FullName -Certificate $cert -HashAlgorithm SHA256 -TimestampServer http://timestamp.digicert.com
            if (-not $r.SignerCertificate) { throw "Signing failed: $($f.Name) $($r.StatusMessage)" }
            Write-Host "signed $($f.Name)"
          }
          Remove-Item $pfx -Force
      - name: Pack windows
        shell: pwsh
        run: Compress-Archive -Path khmer_calendar\build\windows\x64\runner\Release\* -DestinationPath KhmerCalendar-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: KhmerCalendar-windows.zip

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: khmer_calendar
      - run: flutter build macos --release
        working-directory: khmer_calendar
      - name: Sign macOS app (codesign)
        env:
          PFX_B64: ${{ secrets.DESKTOP_SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.DESKTOP_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PFX_B64" || { echo "DESKTOP_SIGN_PFX_BASE64 secret is missing"; exit 1; }
          KC="$RUNNER_TEMP/sign.keychain-db"; KP="$(openssl rand -hex 12)"
          echo "$PFX_B64" | base64 -d > "$RUNNER_TEMP/codesign.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/codesign.p12" -k "$KC" -P "$PFX_PASS" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          HASH=$(security find-identity -p codesigning "$KC" | grep -m1 'Mounsok Dara' | awk '{print $2}')
          test -n "$HASH" || { echo "signing identity not found"; exit 1; }
          APP=$(find khmer_calendar/build/macos -name "*.app" | head -1)
          codesign --force --deep --timestamp=none --sign "$HASH" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Authority|Signature|Identifier' || true
          rm -f "$RUNNER_TEMP/codesign.p12"
      - name: Pack dmg
        run: |
          APP=$(find khmer_calendar/build/macos -name "*.app" | head -1)
          hdiutil create -volname "Khmer Calendar" -srcfolder "$APP" -ov -format UDZO KhmerCalendar.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: KhmerCalendar.dmg

  project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pack source
        run: |
          git archive --format=zip --output KhmerCalendar-project.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: project
          path: KhmerCalendar-project.zip

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: khmer_calendar
      - run: flutter build web --release --web-resources-cdn --base-href /
        working-directory: khmer_calendar
      - name: Pack web
        run: |
          (cd khmer_calendar/build/web && zip -r "$GITHUB_WORKSPACE/KhmerCalendar-web.zip" .)
          mkdir -p dist
          cp -a khmer_calendar/build/web/. dist/
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: KhmerCalendar-web.zip

  release:
    needs: [android, linux, windows, macos, project, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Stage files
        run: |
          mkdir -p release-files
          cp dist/android/app-release.apk release-files/KhmerCalendar.apk
          cp dist/windows/KhmerCalendar-windows.zip release-files/KhmerCalendar-windows.zip
          cp dist/macos/KhmerCalendar.dmg release-files/KhmerCalendar.dmg
          cp dist/linux/KhmerCalendar-linux.tar.gz release-files/KhmerCalendar-linux.tar.gz
          cp dist/project/KhmerCalendar-project.zip release-files/KhmerCalendar-project.zip
          cp dist/web/KhmerCalendar-web.zip release-files/KhmerCalendar-web.zip
          ls -lh release-files
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version:' khmer_calendar/pubspec.yaml | sed 's/^version:[[:space:]]*//; s/+.*//')
          TAG="v${VERSION}"
          NOTES_FILE=".github/release-body.md"
          echo "Publishing ${TAG}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            release-files/KhmerCalendar.apk \
            release-files/KhmerCalendar-windows.zip \
            release-files/KhmerCalendar.dmg \
            release-files/KhmerCalendar-linux.tar.gz \
            release-files/KhmerCalendar-project.zip \
            release-files/KhmerCalendar-web.zip \
            --target "$GITHUB_SHA" \
            --title "Khmer Calendar $TAG" \
            --notes-file "$NOTES_FILE" \
            --latest
