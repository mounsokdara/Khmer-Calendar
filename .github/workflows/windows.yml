# Windows: build, Authenticode-sign, bundle the Visual C++ runtime, then make the portable
# zip (khmer-calendar-portable.zip) and the setup wizard (KhmerCalendar-windows-setup.exe).
# Runs on its own (Actions tab > Run workflow) or is called by release.yml.
name: Windows

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: khmer_calendar
      - run: flutter build windows --release
        working-directory: khmer_calendar
        env:
          CXXFLAGS: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      - name: Sign windows (Authenticode)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.DESKTOP_SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.DESKTOP_SIGN_PASSWORD }}
        run: ./scripts/sign-windows.ps1 -Dir khmer_calendar\build\windows\x64\runner\Release
      # After signing on purpose: these are Microsoft-signed and must stay that way.
      - name: Bundle Visual C++ runtime (so it runs without the redistributable installed)
        shell: pwsh
        run: ./scripts/bundle-vcruntime.ps1 -Dir khmer_calendar\build\windows\x64\runner\Release
      - name: Pack windows
        shell: pwsh
        run: Compress-Archive -Path khmer_calendar\build\windows\x64\runner\Release\* -DestinationPath khmer-calendar-portable.zip
      - name: Verify package (runtime DLLs + icon)
        shell: pwsh
        run: ./scripts/verify-windows.ps1 -Zip khmer-calendar-portable.zip
      # Setup wizard (Inno Setup): same signed files + runtime as the portable zip.
      - name: Build setup wizard (installer)
        shell: pwsh
        run: |
          $v = ((Select-String -Path khmer_calendar\pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value) -replace '\+.*$',''
          ./scripts/build-installer.ps1 -SourceDir khmer_calendar\build\windows\x64\runner\Release -OutDir installer-out -Version $v
      - name: Sign the installer (Authenticode)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.DESKTOP_SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.DESKTOP_SIGN_PASSWORD }}
        run: ./scripts/sign-windows.ps1 -Dir installer-out
      - name: Test the installer (silent install, shortcut, uninstall)
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Setup installer-out\KhmerCalendar-windows-setup.exe
      - name: Put the installer next to the zip
        shell: pwsh
        run: Copy-Item installer-out\KhmerCalendar-windows-setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            khmer-calendar-portable.zip
            KhmerCalendar-windows-setup.exe
