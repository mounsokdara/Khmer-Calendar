# Windows: one standalone job per architecture (x64, arm64): build, Authenticode-sign, bundle the Visual C++ runtime,
# then make the portable zip KhmerCalendar-windows-<arch>.zip. The x64 job also makes the setup wizard
# (KhmerCalendar-windows-setup.exe). The arm64 job is best-effort (continue-on-error) so it can never block a release.
# Runs on its own (Actions tab > Run workflow) or is called by release.yml.
name: Windows

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest, experimental: false }
          - { arch: arm64, runner: windows-11-arm, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      # Flutter builds for the architecture of the machine its own SDK runs on (there is no --target-platform for
      # Windows), so the arm64 job needs a native arm64 SDK. No arm64 archive is published, so use git (the tool
      # downloads the native arm64 Dart SDK itself).
      - name: Flutter SDK 3.47.4 from git (arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.47.4 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$env:RUNNER_TEMP\flutter\bin\flutter.bat" --version
      - run: flutter pub get
        working-directory: khmer_calendar
      - run: flutter build windows --release
        working-directory: khmer_calendar
        env:
          CXXFLAGS: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      - name: Sign windows (Authenticode)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.DESKTOP_SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.DESKTOP_SIGN_PASSWORD }}
        run: ./scripts/sign-windows.ps1 -Dir khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release
      # After signing on purpose: these are Microsoft-signed and must stay that way.
      - name: Bundle Visual C++ runtime (so it runs without the redistributable installed)
        shell: pwsh
        run: ./scripts/bundle-vcruntime.ps1 -Dir khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release -Arch ${{ matrix.arch }}
      - name: Pack windows
        shell: pwsh
        run: Compress-Archive -Path khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release\* -DestinationPath KhmerCalendar-windows-${{ matrix.arch }}.zip
      - name: Verify package (runtime DLLs + icon)
        shell: pwsh
        run: ./scripts/verify-windows.ps1 -Zip KhmerCalendar-windows-${{ matrix.arch }}.zip
      # Setup wizard (Inno Setup): same signed files + runtime as the portable zip.
      - name: Build setup wizard (installer)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $v = ((Select-String -Path khmer_calendar\pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value) -replace '\+.*$',''
          ./scripts/build-installer.ps1 -SourceDir khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release -OutDir installer-out -Version $v
      - name: Sign the installer (Authenticode)
        if: matrix.arch == 'x64'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.DESKTOP_SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.DESKTOP_SIGN_PASSWORD }}
        run: ./scripts/sign-windows.ps1 -Dir installer-out
      - name: Test the installer (silent install, shortcut, uninstall)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Setup installer-out\KhmerCalendar-windows-setup.exe
      - name: Put the installer next to the zip
        if: matrix.arch == 'x64'
        shell: pwsh
        run: Copy-Item installer-out\KhmerCalendar-windows-setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          if-no-files-found: ignore
          path: |
            KhmerCalendar-windows-${{ matrix.arch }}.zip
            KhmerCalendar-windows-setup.exe
