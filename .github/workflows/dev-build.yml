name: Private Repo Auto Rebuild Payment Failed Handle
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: dev-build
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
  REPO: ${{ github.repository }}

jobs:
  build:
    name: Public, build, wait
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Make this repo public
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::Add the SYNC_TOKEN secret"; exit 1; }
          gh api -X PATCH "repos/$REPO" -F private=false --jq '"private=\(.private)"'
          sleep 5

      - name: Start or re-run Release
        id: start
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Latest Release run for this exact commit (push run, earlier dispatch, ...)
          read -r id status conclusion attempt < <(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=50" \
            --jq '[.workflow_runs[] | select(.name == "Release")] | sort_by(.created_at) | last
                  | if . == null then "none none none 0" else "\(.id) \(.status) \(.conclusion // "none") \(.run_attempt)" end')
          echo "Existing run for $SHA: id=$id status=$status conclusion=$conclusion attempt=$attempt"

          dispatch_new() {
            local since; since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run release.yml --repo "$REPO" --ref "$BRANCH"
            id=""
            for i in $(seq 1 30); do
              sleep 5
              id=$(gh api "repos/$REPO/actions/runs?event=workflow_dispatch&branch=$BRANCH&created=>=$since" \
                --jq '.workflow_runs | map(select(.name == "Release")) | sort_by(.created_at) | last | .id // empty')
              [ -n "$id" ] && break
            done
            [ -n "$id" ] || { echo "::error::Build run did not appear"; exit 1; }
            echo "Started new run $id"
          }

          if [ "$id" = none ]; then
            dispatch_new
          elif [ "$status" != completed ]; then
            echo "Already running, waiting for it"
          elif [ "$conclusion" = success ] && [ "$EVENT" = push ]; then
            echo "Same commit already built successfully, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$conclusion" = success ]; then
            dispatch_new
          else
            echo "Same commit finished as $conclusion, re-running failed jobs"
            if gh run rerun "$id" --failed --repo "$REPO"; then
              for i in $(seq 1 30); do
                sleep 5
                now=$(gh api "repos/$REPO/actions/runs/$id" --jq .run_attempt)
                [ "$now" -gt "$attempt" ] && break
              done
            else
              echo "Re-run not possible, starting a new run instead"
              dispatch_new
            fi
          fi
          echo "run=$id" >> "$GITHUB_OUTPUT"
          echo "Build run: https://github.com/$REPO/actions/runs/$id"

      - name: Wait for Release
        if: steps.start.outputs.skip != 'true'
        env:
          RUN: ${{ steps.start.outputs.run }}
        run: |
          set -euo pipefail
          while true; do
            read -r status conclusion < <(gh api "repos/$REPO/actions/runs/$RUN" --jq '"\(.status) \(.conclusion // "none")"')
            echo "$(date -u +%T) $status $conclusion"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] || { echo "::error::Release finished: $conclusion"; exit 1; }
              break
            fi
            sleep 30
          done

  make-private:
    name: Set repo back to private
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Make this repo private
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::SYNC_TOKEN missing"; exit 1; }
          gh api -X PATCH "repos/$REPO" -F private=true --jq '"private=\(.private)"'
          sleep 3
          [ "$(gh api "repos/$REPO" --jq .private)" = true ] || { echo "::error::Repo is still public"; exit 1; }
