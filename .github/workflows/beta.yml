name: Beta APK

# Manual only: Actions > Beta APK > Run workflow.
# Android only. Signs with the keystore committed at scripts/khmer-release.keystore (the same
# key that signed v1.0.0 - v1.0.2), then publishes a PRE-RELEASE tagged v<version>_BETA.
# It never becomes "latest", so the in-app updater and the website download link are untouched.
# The build FAILS if the APK is not signed with the expected key, so the key can't silently change.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, numbers only (e.g. 1.0.4)"
        required: true
        default: "1.0.4"
      build:
        description: "Android versionCode (must be higher than the last release)"
        required: true
        default: "5"

concurrency:
  group: beta
  cancel-in-progress: true

permissions:
  contents: write

env:
  KHMER_BUILD_PACKS: "1"
  EXPECTED_CERT_SHA256: "e4eb72457c4a3f641de537f0d46abf3cb8cf00deade51b78ad583b864b05ab40"

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: khmer_calendar
      # arm + arm64 only: every real phone, and a much smaller APK than the 3-ABI build.
      - name: Build signed beta APK
        working-directory: khmer_calendar
        env:
          ANDROID_KEYSTORE: ${{ github.workspace }}/scripts/khmer-release.keystore
          BETA_VERSION: ${{ inputs.version }}
          BETA_BUILD: ${{ inputs.build }}
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-name="$BETA_VERSION" --build-number="$BETA_BUILD"
      - name: Verify signing key
        run: |
          APK=khmer_calendar/build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs --verbose "$APK" | tee verify.txt
          GOT=$(grep -m1 "certificate SHA-256" verify.txt | awk '{print $NF}')
          echo "expected: $EXPECTED_CERT_SHA256"
          echo "got:      $GOT"
          test "$GOT" = "$EXPECTED_CERT_SHA256"
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_VERSION: ${{ inputs.version }}
          BETA_BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          TAG="v${BETA_VERSION}_BETA"
          cp khmer_calendar/build/app/outputs/flutter-apk/app-release.apk KhmerCalendar-beta.apk
          cat > beta-notes.md <<EOF
          # Khmer Calendar v${BETA_VERSION} BETA (build ${BETA_BUILD})

          Test build. It is a pre-release, so the in-app updater and the website do not offer it.

          **Signing key:** signed with the original Khmer Calendar key (the same one as v1.0.0, v1.0.1 and v1.0.2).

          - Installed **v1.0.0 - v1.0.2**: this installs over it as a normal update.
          - Installed **v1.0.3**: that build used a different key, so Android will refuse to update it. Uninstall v1.0.3 first (this removes the app's data), then install this beta.

          Found a bug? Open an issue and mention "BETA".
          EOF
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" KhmerCalendar-beta.apk \
            --target "$GITHUB_SHA" \
            --title "Khmer Calendar v${BETA_VERSION} BETA" \
            --notes-file beta-notes.md \
            --prerelease --latest=false
