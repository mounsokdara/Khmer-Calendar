# One-off: rebuild old release APKs with the rotated signing key and strip the leaked keystore from source zips.
name: Resign old releases
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "JSON array of release tags to rebuild"
        default: '["v1.0.0","v1.0.1","v1.0.2"]'
permissions:
  contents: write
jobs:
  resign:
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(inputs.tags) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tag }}
      - name: Read flutter version used by this tag
        id: fv
        run: |
          V=$(grep -m1 'flutter-version' .github/workflows/release.yml | sed -E 's/.*"([0-9.]+)".*/\1/')
          echo "Flutter $V"
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fv.outputs.v }}
          channel: stable
          cache: true
      - name: Patch signing to use secrets and restore key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KS_B64" || { echo "ANDROID_KEYSTORE_BASE64 missing"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          rm -f scripts/khmer-release.keystore khmer_calendar/android/app/khmer-release.keystore
          python3 - <<'PY'
          p = "khmer_calendar/android/app/build.gradle.kts"
          s = open(p).read()
          a = s.index("    signingConfigs {")
          b = s.index("    buildTypes {")
          new = "\n".join([
              "    signingConfigs {",
              "        create(\"release\") {",
              "            val ks = System.getenv(\"ANDROID_KEYSTORE\")",
              "            if (ks != null && file(ks).exists()) {",
              "                storeFile = file(ks)",
              "                storePassword = System.getenv(\"ANDROID_KEYSTORE_PASSWORD\")",
              "                keyAlias = System.getenv(\"ANDROID_KEY_ALIAS\")",
              "                keyPassword = System.getenv(\"ANDROID_KEY_PASSWORD\")",
              "            }",
              "        }",
              "    }",
              "",
              "",
          ])
          open(p, "w").write(s[:a] + new + s[b:])
          PY
      - run: flutter pub get
        working-directory: khmer_calendar
      - run: flutter build apk --release
        working-directory: khmer_calendar
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Verify APK is signed with the NEW key
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          APK=khmer_calendar/build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          GOT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          WANT=$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KS_PASS" | grep -m1 'SHA256:' | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "apk cert:      $GOT"
          echo "expected cert: $WANT"
          test -n "$GOT" && test "$GOT" = "$WANT"
      - name: Replace release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/up" "$RUNNER_TEMP/dl"
          cp khmer_calendar/build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/up/KhmerCalendar.apk"
          gh release download "$TAG" -p KhmerCalendar-project.zip -D "$RUNNER_TEMP/dl" --clobber
          zip -d "$RUNNER_TEMP/dl/KhmerCalendar-project.zip" 'scripts/khmer-release.keystore' || true
          if unzip -l "$RUNNER_TEMP/dl/KhmerCalendar-project.zip" | grep -iE 'keystore|\.jks'; then echo "keystore still in zip"; exit 1; fi
          gh release upload "$TAG" "$RUNNER_TEMP/up/KhmerCalendar.apk" "$RUNNER_TEMP/dl/KhmerCalendar-project.zip" --clobber
