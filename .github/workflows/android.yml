# Android: standalone jobs, one per package (arm32, arm64, x64, arm32_64, universal).
# Each job builds, aligns, signs (v1+v2+v3+v4) and verifies its own APK and uploads it as its own artifact;
# release.yml then publishes every APK as its own release asset (nothing has to be unzipped from a bundle).
# Version code = versionCode from version.txt (via pubspec.yaml), the same for every package and never the run number.
# Version name = <versionName>_<BuildType>, e.g. 1.0.5_Arm64 (see build.gradle.kts).
#   Not possible with Flutter: x86 (32-bit Intel), x86_x64 (contains x86) and armeabi (ARMv5/v6). Flutter's
#   --target-platform for Android only accepts android-arm, android-arm64 and android-x64 (in every build mode).
# Runs on its own (Actions tab > Run workflow) or is called by release.yml.
name: Android

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: android-${{ matrix.name }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: arm32,     btype: Arm32, target: "android-arm",                           mode: release, split: true,  out: app-armeabi-v7a-release.apk, experimental: false }
          - { name: arm64,     btype: Arm64, target: "android-arm64",                         mode: release, split: true,  out: app-arm64-v8a-release.apk,   experimental: false }
          - { name: x64,       btype: X64, target: "android-x64",                           mode: release, split: true,  out: app-x86_64-release.apk,      experimental: false }
          - { name: arm32_64,  btype: Arm32_64, target: "android-arm,android-arm64",             mode: release, split: false, out: app-release.apk,            experimental: false }
          - { name: universal, btype: Universal, target: "android-arm,android-arm64,android-x64", mode: release, split: false, out: app-release.apk,            experimental: false }
    steps:
      - uses: actions/checkout@v4
      - name: Apply version.txt
        run: bash scripts/set-version.sh --apply
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/khmer-release.keystore"
      # The NDK download from Google sometimes arrives corrupted ("Error reading Zip content"); retry it before Gradle needs it.
      - name: Install NDK (with retry)
        run: |
          NDK=28.2.13676358
          SDKM="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3; do
            yes | "$SDKM" --install "ndk;$NDK" && break
            echo "NDK install failed (attempt $i), cleaning up and retrying"
            rm -rf "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/$NDK"
            sleep 10
          done
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/$NDK"
      - run: node tools/gen-assets.mjs khmer_calendar
      - run: flutter pub get
        working-directory: khmer_calendar
      # --split-debug-info strips debug symbols from libapp.so; symbols are kept as an artifact.
      # No --build-number: the version code is the one in pubspec.yaml (from version.txt), the same for every package.
      - run: flutter build apk --${{ matrix.mode }} ${{ matrix.split && '--split-per-abi' || '' }} --target-platform ${{ matrix.target }} --dart-define=BUILD_TYPE=${{ matrix.btype }} ${{ matrix.mode == 'release' && '--split-debug-info=build/symbols' || '' }}
        working-directory: khmer_calendar
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/khmer-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Align, sign (v1+v2+v3+v4) + verify
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          OUTDIR=khmer_calendar/build/app/outputs/flutter-apk
          KS_FILE="$RUNNER_TEMP/khmer-release.keystore" bash scripts/sign-apk.sh "$OUTDIR/${{ matrix.out }}" "$OUTDIR/KhmerCalendar-${{ matrix.name }}.apk"
          AAPT2=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)
          VC=$([ -n "$AAPT2" ] && "$AAPT2" dump badging "$OUTDIR/KhmerCalendar-${{ matrix.name }}.apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1 || true)
          echo "KhmerCalendar-${{ matrix.name }}.apk versionCode=${VC:-?}"
          echo "::notice title=${{ matrix.name }}::versionCode ${VC:-?}"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.name }}
          path: khmer_calendar/build/app/outputs/flutter-apk/KhmerCalendar-${{ matrix.name }}.apk
      - uses: actions/upload-artifact@v4
        if: matrix.mode == 'release'
        with:
          name: android-symbols-${{ matrix.name }}
          path: khmer_calendar/build/symbols
