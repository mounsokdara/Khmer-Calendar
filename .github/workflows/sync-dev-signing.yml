name: Sync dev signing (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q pynacl
      - name: Copy signing secrets to the dev repo
        env:
          TOKEN: ${{ secrets.DEV_SYNC_TOKEN }}
          S_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          S_KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          S_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          S_KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from nacl import encoding, public
          T = os.environ["TOKEN"]
          R = "mounsokdara/Khmer-Calendar.Dev"
          def api(method, path, body=None):
              req = urllib.request.Request("https://api.github.com" + path, method=method,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={"Authorization": "Bearer " + T, "Accept": "application/vnd.github+json"})
              r = urllib.request.urlopen(req); d = r.read()
              return r.status, (json.loads(d) if d else {})
          _, k = api("GET", f"/repos/{R}/actions/secrets/public-key")
          box = public.SealedBox(public.PublicKey(k["key"].encode(), encoding.Base64Encoder()))
          pairs = {"ANDROID_KEYSTORE_BASE64": "S_KS", "ANDROID_KEYSTORE_PASSWORD": "S_KSP",
                   "ANDROID_KEY_ALIAS": "S_ALIAS", "ANDROID_KEY_PASSWORD": "S_KP"}
          for name, env in pairs.items():
              v = os.environ[env]
              assert v, name + " is empty"
              enc = base64.b64encode(box.encrypt(v.encode())).decode()
              st, _ = api("PUT", f"/repos/{R}/actions/secrets/{name}", {"encrypted_value": enc, "key_id": k["key_id"]})
              print(name, st)
          PY
